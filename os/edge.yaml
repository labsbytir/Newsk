# Newsk Edge — bare-bones headless scraper. Smallest runtime, no AI.
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-base
    - ca-certificates-bundle
    - gonewsk

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: nonroot

entrypoint:
  command: /usr/bin/entrypoint.sh

annotations:
  org.opencontainers.image.title: "Newsk Edge"
  org.opencontainers.image.description: "Newsk Edge: bare-bones headless news scraper. tir labs inc."
  org.opencontainers.image.vendor: "tir labs inc."
  org.opencontainers.image.url: "https://github.com/labsbytir/Newsk"
