# Newsk Full — Openbox desktop + EmDash + Harper + scraper + MiniLM.
# LXQt is NOT in Wolfi (no lxqt-*, no QtSvg); this Openbox desktop is what
# builds today. Same Newsk core as Lite. GUI runs against host X:
#   podman run -e DISPLAY -v /tmp/.X11-unix:/tmp/.X11-unix newsk-full
contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    - melange.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
  packages:
    - wolfi-base
    - ca-certificates-bundle
    - nodejs-24
    - npm
    - xorg-server
    - openbox
    - xterm
    - feh
    - gtk-3
    - hicolor-icon-theme
    - python3.13
    - emdash
    - emdash-harper
    - newsk-full-assets
    - gonewsk
    - gonewsk-embed-minilm

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
  run-as: nonroot

entrypoint:
  command: /usr/bin/newsk-desktop

annotations:
  org.opencontainers.image.title: "Newsk Full"
  org.opencontainers.image.description: "Newsk Full: Openbox desktop + EmDash + Harper + scraper. tir labs inc."
  org.opencontainers.image.vendor: "tir labs inc."
  org.opencontainers.image.url: "https://github.com/labsbytir/GoNewsk"