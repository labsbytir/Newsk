package:
  name: newsk-full-assets
  version: 0.1.0
  epoch: 0
  description: "Newsk Full desktop assets: Openbox session, Lucide icons, wallpapers"
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mkdir -p ${{targets.contextdir}}/etc/newsk
      mkdir -p ${{targets.contextdir}}/usr/share/newsk/icons
      mkdir -p ${{targets.contextdir}}/usr/share/newsk/wallpapers
      install -m 0755 /home/build/os/full/newsk-desktop.sh ${{targets.contextdir}}/usr/bin/newsk-desktop
      install -m 0644 /home/build/os/full/openbox-autostart ${{targets.contextdir}}/etc/newsk/openbox-autostart
      cp /home/build/os/full/icons/*.svg ${{targets.contextdir}}/usr/share/newsk/icons/
      cp /home/build/os/full/wallpapers/wp-*.jpg ${{targets.contextdir}}/usr/share/newsk/wallpapers/ 2>/dev/null || true

  - uses: strip